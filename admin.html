 <p class="small text-uppercase mb-2" style="color: rgba(255,255,255,0.4); letter-spacing: 0.08em;">Gestión</p>

  <!--
       CONTENIDO PENDIENTE — Panel administrativo
       Requerimientos: RF-09 (crear curso), RF-10 (modificar/activar/desactivar
       curso), RD-03 (curso desactivado no aparece en catálogo público),
       RD-04 (solo el admin gestiona el catálogo)
       Casos de uso: CU-03 (Crear curso), CU-04 (Desactivar curso)
       Sugerido: sidebar oscuro (.admin-sidebar) con secciones "Cursos" y
       "Usuarios", tarjetas de métricas (.stat-card) y tabla (.table-admin)
       con acciones editar/activar/desactivar. Modal para "Nuevo curso".
       Nota: hasta integrar Firestore (Sprint 2), los cambios de estado
       pueden resolverse con JS de demostración, sin persistencia real.
       Prototipo de referencia: https://height-shaky-07694666.figma.site/
  -->
  <div class="p-4">

    <p class="text-body-secondary">Contenido pendiente de implementar.</p>
  </div>
