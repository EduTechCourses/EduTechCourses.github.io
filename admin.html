<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel administrativo — EduTechCourses</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml">
  <style>
    body {
      visibility: hidden;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-etc-light sticky-top" aria-label="Navegación principal">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="assets/logo/logo.svg" alt="Logo de EduTechCourses" class="brand-logo">
        <span class="brand-name">EduTechCourses</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
        aria-controls="navMenu" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
        </ul>
        <div class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center gap-2 gap-lg-3">
          <a href="admin.html" class="admin-link fw-semibold text-navy">Admin</a>
          <a href="perfil.html" class="user-chip text-decoration-none">
            <span class="avatar-sm" id="navAvatarSm">--</span> <span id="navNombreSm">Cargando...</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="d-flex" style="min-height: calc(100vh - 62px);">
    <!-- Sidebar -->
    <aside class="admin-sidebar p-3 d-none d-lg-flex flex-column justify-content-between"
      style="width: 250px; flex-shrink: 0;">
      <div>
        <p class="small text-uppercase mb-1" style="color: rgba(255,255,255,0.5); letter-spacing: 0.08em;">Panel admin
        </p>
        <h2 class="h6 mb-3" style="color:#fff;">EduTechCourses</h2>
        <div class="d-flex align-items-center gap-2 mb-4 pb-3" style="border-bottom: 1px solid rgba(255,255,255,0.1);">
          <span class="avatar-sm" id="sidebarAvatarSm">--</span>
          <span class="small" id="sidebarNombreRol">Cargando...</span>
        </div>
        <p class="small text-uppercase mb-2" style="color: rgba(255,255,255,0.4); letter-spacing: 0.08em;">Gestión</p>
        <ul class="nav nav-pills flex-column gap-1">
          <li class="nav-item">
            <a href="#" class="nav-link active" data-seccion="resumen">
              <span><i class="bi bi-speedometer2 me-2"></i>Resumen</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link" data-seccion="cursos">
              <span><i class="bi bi-collection me-2"></i>Cursos</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link" data-seccion="usuarios">
              <span><i class="bi bi-people me-2"></i>Usuarios</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link" data-seccion="adquisiciones">
              <span><i class="bi bi-receipt me-2"></i>Adquisiciones</span>
            </a>
          </li>
        </ul>
      </div>
      <a href="index.html" class="admin-back-link"><i class="bi bi-arrow-left me-1"></i>Volver al sitio</a>
    </aside>

    <!-- Contenido -->
    <main class="flex-grow-1 p-4">

      <!-- Menú de secciones para pantallas chicas (el menú lateral solo se ve desde lg) -->
            <ul class="nav nav-pills admin-nav-mobile flex-wrap gap-1 mb-4 d-lg-none" aria-label="Secciones del panel">
        <li class="nav-item">
          <a href="#" class="nav-link active text-nowrap" data-seccion="resumen">Resumen</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link text-nowrap" data-seccion="cursos">Cursos</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link text-nowrap" data-seccion="usuarios">Usuarios</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link text-nowrap" data-seccion="adquisiciones">Adquisiciones</a>
        </li>
      </ul>

      <!-- Cada sección es un módulo JavaScript que dibuja su contenido dentro de su contenedor
           (ver js/pages/admin-*.js). No agregar contenido fijo acá. -->
      <section id="seccion-resumen" aria-label="Resumen">
        <div id="contenedor-resumen"></div>
      </section>

      <section id="seccion-cursos" class="d-none" aria-label="Cursos">
        <div id="contenedor-cursos"></div>
      </section>

      <section id="seccion-usuarios" class="d-none" aria-label="Usuarios">
        <div id="contenedor-usuarios"></div>
      </section>

      <section id="seccion-adquisiciones" class="d-none" aria-label="Adquisiciones">
        <div id="contenedor-adquisiciones"></div>
      </section>

    </main>
  </div>

  <!-- Los módulos insertan acá sus modales -->
  <div id="contenedor-modales"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/base.js"></script>
  <script type="module" src="js/pages/admin.js"></script>
</body>

</html>
