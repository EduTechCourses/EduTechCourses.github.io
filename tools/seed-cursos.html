  1. Abrir el proyecto con Live Server (VS Code).
  2. Iniciar sesión en login.html con la cuenta ADMINISTRADOR (mismo origen).

        const estado = document.getElementById("estadoSesion");
        const boton = document.getElementById("btnCargar");
        const log = document.getElementById("log");
        const escribir = (texto) => { log.textContent += texto + "\n"; };

        onAuthStateChanged(auth, async (usuario) => {
            if (!usuario) {
                estado.textContent = "No hay sesión. Iniciá sesión con la cuenta admin en login.html y volvé.";
                return;
            }
            const perfil = await getDoc(doc(db, "usuarios", usuario.uid));
            if (!perfil.exists() || perfil.data().rol !== "administrador") {
                estado.textContent = "La sesión actual (" + usuario.email + ") no es administrador.";
                return;
            }
            estado.textContent = "Sesión admin: " + usuario.email;
            boton.disabled = false;
        });

        boton.addEventListener("click", async () => {
            boton.disabled = true;
            for (const curso of CURSOS) {
                const { docId, ...datos } = curso;
                try {
                    const ref = doc(db, "cursos", docId);
                    if ((await getDoc(ref)).exists()) {
                        escribir("Salteado (ya existe): " + docId + " · " + datos.nombre);
                        continue;
                    }
                    await setDoc(ref, { ...datos, fechaCreacion: serverTimestamp() });
                    escribir("Creado: " + docId + " · " + datos.nombre);
                } catch (error) {
                    escribir("ERROR en " + docId + ": " + error.code + " — " + error.message);
                }
            }
            escribir("Listo.");
        });
